version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: messmate-db
    environment:
      POSTGRES_USER: messmate
      POSTGRES_PASSWORD: messmate_secret
      POSTGRES_DB: messmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messmate -d messmate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messmate-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://messmate:messmate_secret@db:5432/messmate_db
      DEBUG: "true"
      SECRET_KEY: "change-this-in-production"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
